version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-ecommerce}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    restart: on-failure
    environment:
      NODE_ENV: development
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3001
      CATEGORY_SERVICE_URL: http://category-service:3001
      PRODUCT_SERVICE_URL: http://product:3004
      PORT: 4000
    ports:
      - "4000:4000"
    env_file:
      - ./.env
    working_dir: /app/apps/api-gateway
    command: npm run start:dev
    depends_on:
      - auth-service
      - user-service
      - category-service
      - product
    volumes:
      - ./apps/api-gateway/src:/app/src
      - ./apps/api-gateway/node_modules:/app/node_modules
    networks:
      - app-network
    

  auth-service:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    restart: on-failure
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-ecommerce}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "30011:3001"
    env_file:
      - ./.env
    working_dir: /app/apps/auth
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/auth/src:/app/src
      - ./apps/auth/node_modules:/app/node_modules
    networks:
      - app-network
    

  category-service:
    build:
      context: .
      dockerfile: apps/category/Dockerfile
    restart: on-failure
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-ecommerce}
    ports:
      - "30012:3001"
    env_file:
      - ./.env
    working_dir: /app/apps/category
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/category/src:/app/src
      - ./apps/category/node_modules:/app/node_modules
    networks:
      - app-network
    

  product:
    build:
      context: .
      dockerfile: apps/product/Dockerfile
    restart: on-failure
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-ecommerce}
      PRODUCT_DB_NAME: product_db
    ports:
      - "30014:3004"
    env_file:
      - ./.env
    working_dir: /app/apps/product
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/product/src:/app/src
      - ./apps/product/node_modules:/app/node_modules
    networks:
      - app-network
    

  user-service:
    build:
      context: .
      dockerfile: apps/user/Dockerfile
    restart: on-failure
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-ecommerce}
    ports:
      - "30013:3001"
    env_file:
      - ./.env
    working_dir: /app/apps/user
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/user/src:/app/src
      - ./apps/user/node_modules:/app/node_modules
    networks:
      - app-network
    
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./packages/monitoring/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - ./packages/monitoring/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  grafana_data:


networks:
  app-network:
    driver: bridge
